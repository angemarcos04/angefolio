services:
  - type: web
    name: angefolio
    runtime: docker
    plan: free
    region: singapore
    autoDeployTrigger: off
    healthCheckPath: /health/ready
    envVars:
      - key: PORT
        value: '4321'
      - key: DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: PUBLIC_SITE_URL
        sync: false
